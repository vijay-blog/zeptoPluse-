server:
  port: ${SERVER_PORT:8080}

Spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQL_DATABASE:${MYSQLDATABASE:zeptopluse}}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:${MYSQL_USERNAME:${DB_USERNAME:root}}}
    password: ${MYSQL_PASSWORD:${MYSQLPASSWORD:${DB_PASSWORD:}}}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}

server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQL_DATABASE}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQLUSER}
    password: ${MYSQL_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
flyway:
    enabled: true
jackson:
    serialization:
      write-dates-as-timestamps: false

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}

security:
  jwt:
    secret: ${NEXAMART_JWT_SECRET:}
    access-expiration-seconds: ${NEXAMART_ACCESS_EXPIRATION_SECONDS:3600}
  bootstrap-admin:
    email: ${NEXAMART_ADMIN_EMAIL:}
    password: ${NEXAMART_ADMIN_PASSWORD:}
    name: ${NEXAMART_ADMIN_NAME:NexaMart Admin}

services:
  mysql:
    image: mysql:8
    container_name: zeptopluse-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zeptopluse}
      MYSQL_USER: ${MYSQL_USER:-zeptopluse}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in your environment}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your environment}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - zeptopluse_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  zeptopluse_mysql_data:
